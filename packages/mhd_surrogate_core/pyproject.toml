# pyproject.toml for the mhd_surrogate_core package

[build-system]
requires = ["setuptools>=59.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mhd_surrogate_core"
version = "0.1.0"
authors = [
  { name="Michael Skowronek", email="michael.skowronek.91@gmail.com" },
]
description = "Core utilities, data loading, and plotting for MHD surrogate modeling."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

# This list is now empty, as we assume all third-party
# dependencies are provided by the environment.
dependencies = []

# Optional dependencies document what is needed without forcing installation.
# To install these on a local machine, use: pip install -e ".[core,dev]"
[project.optional-dependencies]
core = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
]
dev = [
    "pytest",
    "black",
]


[project.urls]
"Homepage" = "https://github.com/MichaelSkowronek/mhd_surrogate_modelling"
